# Production stack for the VPS: Postgres + Django API (gunicorn).
# The Next.js frontend is deployed to Vercel and proxies /api/* to this API.
#
# Deployed by deploy/vps-deploy.sh. The API listens on 127.0.0.1:API_PORT only;
# a Cloudflare Tunnel on the server publishes it over HTTPS (no open ports).
name: uemp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./backend/.env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.prod
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8050}:8000"

volumes:
  pgdata:
